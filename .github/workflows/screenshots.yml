name: Screenshots

on:
  push:
    branches: [ maham-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop persist.sys.locale=ar-SA -prop persist.sys.language=ar -prop persist.sys.country=SA
          disable-animations: true
          script: bash scripts/screenshots.sh shots

      - name: Upload screenshots (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Maham-Screenshots
          path: shots/*.png

      - name: Attach screenshots to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots >/dev/null 2>&1 || gh release create screenshots --title "Maham — لقطات الشاشة" --notes "لقطات حقيقية من محاكي Android (Pixel 5, API 30)."
          gh release upload screenshots shots/*.png --clobber
