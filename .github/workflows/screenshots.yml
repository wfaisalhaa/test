name: Screenshots

on:
  push:
    branches: [ maham-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop persist.sys.locale=ar-SA -prop persist.sys.language=ar -prop persist.sys.country=SA
          disable-animations: true
          script: |
            adb shell settings put system system_locales ar-SA || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p shots
            shot() { sleep "$2"; adb exec-out screencap -p > "shots/$1.png"; }
            A="com.maham.app/.MainActivity"
            adb shell am start -W -n $A --ez seed_demo true --ei tab 0
            shot 01-tasks 8
            adb shell am start -W --activity-single-top -n $A --ei tab 1
            shot 02-lists 3
            adb shell am start -W --activity-single-top -n $A --ei tab 2
            shot 03-calendar 3
            adb shell am start -W --activity-single-top -n $A --ei tab 3
            shot 04-stats 3
            adb shell am start -W --activity-single-top -n $A --ei tab 0 --ez open_add true
            shot 05-add-task 3
            adb shell input keyevent BACK; sleep 1
            adb shell am start -W --activity-single-top -n $A --ei tab 0 --ez dark true
            shot 06-tasks-dark 3
            adb shell am start -W --activity-single-top -n $A --ei tab 3
            shot 07-stats-dark 3
            adb shell am start -W --activity-single-top -n $A --ei tab 0 --ez dark false
            ls -la shots

      - name: Upload screenshots (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Maham-Screenshots
          path: shots/*.png

      - name: Attach screenshots to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots >/dev/null 2>&1 || gh release create screenshots --title "Maham — لقطات الشاشة" --notes "لقطات حقيقية من محاكي Android (Pixel 5, API 30)."
          gh release upload screenshots shots/*.png --clobber
